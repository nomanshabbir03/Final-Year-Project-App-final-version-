# Render Blueprint (free plan): the Django backend and the web version of the Expo app.
# Secrets are not listed here. After creating the services, upload them as Secret Files
# (service > Environment > Secret Files):
#   backend: .env      - DATABASE_URL must be the Supabase Session pooler URI
#   app:     .env.local and .env.development - EXPO_PUBLIC_BACKEND_URL must be the backend's
#            https://....onrender.com URL (no EXPO_PUBLIC_AUTH_BYPASS: users sign in with Supabase)
services:
  - type: web
    name: personal-companion-backend
    runtime: python
    plan: free
    rootDir: fyp-backend
    buildCommand: bash build.sh
    # Threads let the app's parallel requests (a screen loads several endpoints at once) run side by
    # side; with plain sync workers only two could run and the rest waited in line.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      # Set here so they win over the uploaded .env (which has DEBUG=True for local use)
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Real sign-in: every request needs a Supabase token. "True" lets requests without a token
      # act as one shared demo user (only together with EXPO_PUBLIC_AUTH_BYPASS=1 in the app).
      - key: DEV_AUTH_BYPASS
        value: "False"

  - type: web
    name: personal-companion-app
    runtime: static
    rootDir: fyp-project-app
    buildCommand: bash render-build.sh
    staticPublishPath: dist
    # Single-page app: every path loads index.html and React Navigation takes over
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK
        value: "1"
